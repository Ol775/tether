name: Validate Tether

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The macos-26 runner tops out at Xcode 26.x, whose swift-frontend crashes (signal 6) during
      # IRGen of the Swift 6.4 GUI module (an @isolated(any) reabstraction thunk). The test suite only
      # covers TetherCore, so build just the test target (never the GUI executable) and run it with
      # --skip-build. The GUI is compiled, codesigned and signed on the Mac by release.sh, which runs
      # the full suite before every publish and is the real release gate. Re-add a GUI build here once
      # a runner ships an Xcode that doesn't crash (27.x).
      - name: Test TetherCore
        run: |
          set -o pipefail
          mkdir -p build
          # `swift test` builds every product, and the GUI executable crashes IRGen here, so drop it
          # from the manifest for this ephemeral checkout. The tests only cover TetherCore; the only
          # products left are TetherCore + its test bundle, so none of the GUI is compiled.
          sed -i '' -e '/\.executable(name: "Tether", targets: \["Tether"\]),/d' \
                    -e '/\.executableTarget(name: "Tether", dependencies: \["TetherCore"\]),/d' Package.swift
          swift test --disable-sandbox 2>&1 | tee build/ci-tests.log
      - name: Retain complete test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tether-test-log
          path: build/ci-tests.log

  # Write-scoped and isolated: only checkout + gh run here, never the build/test of
  # (possibly untrusted) code, and only on a main push after the macos job passes.
  draft-release:
    needs: macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Draft a release when VERSION is bumped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(cat VERSION)
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$ver already exists; nothing to draft."; exit 0
          fi
          notes=$(awk -v v="## $ver " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md | sed '/^$/d')
          if [ -z "$notes" ]; then
            echo "VERSION is $ver but CHANGELOG has no entry; skipping draft."; exit 0
          fi
          gh release create "v$ver" --repo "$GITHUB_REPOSITORY" --draft --title "v$ver (beta)" --notes "$notes"
          echo "Drafted v$ver. Finish it on your Mac with: ./release.sh"
